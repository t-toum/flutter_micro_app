name: flutter_micro_app

sdkPath: .fvm/flutter_sdk
ide:
  intellij:
    enabled: false
packages:
  - apps/**
  - modules/**
  - shared/**
ignore:
  - modules/**/example

scripts:
  analyze:
    run: melos exec --concurrency=10 -- "flutter analyze"
    description: Run `flutter analyze` in all packages.
  bootstrap:
    run: melos bootstrap --scope="**"
    description: "Initialize the monorepo, link all local packages, and run `pub get`."
  clean:
    run: melos exec --concurrency=10 -- "flutter clean"
    description: Run `flutter clean` in all packages.
  build-runner:
    description: Generate build-runner
    run: |
      melos exec -c 1 --scope="**" -- \
        flutter pub run build_runner build --delete-conflicting-outputs
  test:
    run: melos exec --scope="todo" -- "flutter test"
    description: Run all tests
  test:coverage:
    run: |
      melos exec --scope="todo" -- \
        flutter test --coverage --coverage-path=coverage/lcov.info
    description: Run tests with coverage for todo module
  test:coverage:clean:
    run: |
      melos exec --scope="todo" -- \
        "if [ -f coverage/lcov.info ]; then \
          lcov --remove coverage/lcov.info \
            '**/*.g.dart' \
            '**/*.freezed.dart' \
            'lib/src/core/network/rest_client.g.dart' \
            -o coverage/lcov_cleaned.info && \
          echo 'Coverage cleaned - generated files excluded'; \
        else \
          echo 'No coverage file found. Run test:coverage first.'; \
        fi"
    description: Clean coverage by removing generated files
  test:coverage:html:
    run: |
      melos exec --scope="todo" -- \
        "if [ -f coverage/lcov_cleaned.info ]; then \
          if command -v genhtml >/dev/null 2>&1; then \
            genhtml coverage/lcov_cleaned.info -o coverage/html \
              --title 'Todo Module Coverage Report' \
              --show-details \
              --legend && \
            echo 'HTML coverage report generated at coverage/html/index.html'; \
          else \
            echo 'genhtml not found. Install: brew install lcov (macOS) or apt-get install lcov (Ubuntu)'; \
          fi; \
        else \
          echo 'No cleaned coverage file found. Run test:coverage:clean first.'; \
        fi"
    description: Generate HTML coverage report from cleaned coverage data
  test:coverage:full:
    run: |
      melos run test:coverage && \
      melos run test:coverage:clean && \
      melos run test:coverage:html
    description: Run full coverage workflow - test, clean, and generate HTML report
command:
  version:
    message: |
      chore: cut package releases 🎉
      {new_package_versions}
